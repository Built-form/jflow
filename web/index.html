<!doctype html>
<!-- Copied from workflows/web/index.html — changes: title Workflows → JFlow; fonts Inter + IBM Plex Mono (was Space Grotesk); home-screen icon, manifest and standalone metas -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The old JFlow hosts move to their PayPulse twins (Dev, 2026-11-20), keeping the path,
         query and hash. Inline and first, so it runs before anything else loads. `replace`
         keeps the old host out of the back button. The session cookie lives on
         .built-form.co.uk, so sign-in carries across. -->
    <script>
      (function () {
        var moved = {
          'jflow.built-form.co.uk': 'paypulse.built-form.co.uk',
          'test-jflow.built-form.co.uk': 'test-paypulse.built-form.co.uk',
        };
        var to = moved[location.hostname.toLowerCase()];
        if (to) location.replace('https://' + to + location.pathname + location.search + location.hash);
      })();
    </script>
    <!-- The plain name, for the instant before the bundle runs; main.tsx overwrites it
         with the environment-aware title from src/config/env.ts. -->
    <title>PayPulse</title>
    <!-- Add to Home Screen (Dev, 2026-11-20, on an iPad): the heartbeat tile as the icon, and
         the app opened from it runs full screen, without the browser's bars. No service
         worker and no offline cache: this is the desk app with an icon, not a PWA. A
         home-screen app keeps its own storage, so it asks for sign-in once itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PayPulse" />
    <!-- Self-host both families before production; Google Fonts is a dev convenience only. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
